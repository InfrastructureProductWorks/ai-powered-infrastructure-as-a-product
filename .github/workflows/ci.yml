name: Modern accelerator CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate self-hosted workflow contract
        run: python3 scripts/validate_self_hosted_workflow.py
      - name: Validate public publication boundary
        env:
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('refs/remotes/origin/{0}', github.event.repository.default_branch) }}
        run: |
          python3 scripts/audit_publication_boundary.py
          python3 -m unittest tests/test_publication_boundary.py -v
      - name: Validate modern accelerator boundary
        run: ./scripts/validate-modern-accelerator.sh
      - name: Verify Portfolio Provenance Gate
        run: python3 scripts/verify_portfolio_provenance.py
      - name: Test Portfolio Provenance Gate fail-closed controls
        run: python3 -m unittest tests/test_portfolio_provenance.py -v
      - name: Validate JSON evidence
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('validated', p)
          PY
      - name: Validate phase manifests
        run: |
          set -euo pipefail
          manifests=(
            artifacts/phase-23/MANIFEST.sha256
            artifacts/phase-24/MANIFEST.sha256
          )
          expected="$(printf '%s\n' "${manifests[@]}" | sort)"
          actual="$(find artifacts -type f -name MANIFEST.sha256 -print | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Phase manifest set is missing, renamed, or unregistered."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            test -f "$manifest"
            sha256sum --check "$manifest"
          done

  publication-boundary-pinned-candidate:
    # Candidate-controlled CI rollout evidence; the independent target gate is separate.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out candidate bytes without executing them
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Intentional data-only checkout: no candidate code or actions execute.
          allow-unsafe-pr-checkout: true
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out independently anchored validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 94f9a7323f7fd565996aac4508d3b9c4639c7f1b
          path: trusted
          persist-credentials: false
      - name: Validate candidate with trusted code
        env:
          PUBLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('refs/remotes/origin/{0}', github.event.repository.default_branch) }}
        run: |
          python3 -I - <<'PY'
          import importlib.util, os, pathlib, sys
          path=pathlib.Path('trusted/scripts/audit_publication_boundary.py').resolve()
          spec=importlib.util.spec_from_file_location('trusted_boundary',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          errors=module.audit(pathlib.Path('candidate').resolve(),os.environ['PUBLICATION_BASE_SHA'])
          for error in errors: print(error)
          print('Pinned candidate publication boundary: '+('FAIL' if errors else 'PASS'))
          sys.exit(bool(errors))
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  attest-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [boundary, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify provenance subject before attestation
        run: python3 scripts/verify_portfolio_provenance.py
      - name: Attest provenance statement to this repository and workflow
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: provenance/portfolio-provenance.json
