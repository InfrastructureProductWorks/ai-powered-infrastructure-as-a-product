name: Modern accelerator CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate modern accelerator boundary
        run: ./scripts/validate-modern-accelerator.sh
      - name: Preview intentional Portfolio Provenance refresh
        run: |
          python3 scripts/verify_portfolio_provenance.py --refresh
          echo '---BEGIN-REFRESHED-PROVENANCE---'
          cat provenance/portfolio-provenance.json
          echo '---END-REFRESHED-PROVENANCE---'
      - name: Verify Portfolio Provenance Gate
        run: python3 scripts/verify_portfolio_provenance.py
      - name: Test Portfolio Provenance Gate fail-closed controls
        run: python3 -m unittest tests/test_portfolio_provenance.py -v
      - name: Validate JSON evidence
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('validated', p)
          PY
      - name: Validate phase manifests
        run: |
          set -euo pipefail
          manifests=(
            artifacts/phase-23/MANIFEST.sha256
            artifacts/phase-24/MANIFEST.sha256
          )
          expected="$(printf '%s\n' "${manifests[@]}" | sort)"
          actual="$(find artifacts -type f -name MANIFEST.sha256 -print | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Phase manifest set is missing, renamed, or unregistered."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            test -f "$manifest"
            sha256sum --check "$manifest"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  attest-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [boundary, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify provenance subject before attestation
        run: python3 scripts/verify_portfolio_provenance.py
      - name: Attest provenance statement to this repository and workflow
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: provenance/portfolio-provenance.json
