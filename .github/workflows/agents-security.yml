name: Composite AI security evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-evals:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: v0.64.1
      - name: Validate policy source
        run: opa check policies/opa
      - name: Prove destructive action is denied
        run: |
          opa eval --format=json \
            -i tests/agents-evals/tool-abuse/danger-verb-without-approval.json \
            -d policies/opa \
            'data.agents.actions.deny' > danger-deny.json
          jq -e '.result[0].expressions[0].value | type == "array" and length > 0' danger-deny.json >/dev/null
      - name: Prove metadata-target SSRF is denied
        run: |
          opa eval --format=json \
            -i tests/agents-evals/ssrf/url-compose.json \
            -d policies/opa \
            'data.agents.ssrf.deny' > ssrf-deny.json
          jq -e '.result[0].expressions[0].value | type == "array" and length > 0' ssrf-deny.json >/dev/null
      - name: Prove prompt-injection fixture remains detectable
        run: grep -E -i '<script|on[a-z]+\=|data:|Ignore all prior instructions' tests/agents-evals/prompt-injection/hidden-html.md
      - uses: actions/upload-artifact@v7
        with:
          name: composite-ai-policy-evidence
          path: |
            danger-deny.json
            ssrf-deny.json
          retention-days: 14
