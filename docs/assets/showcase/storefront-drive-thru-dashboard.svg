  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="58" y="122" font-size="13" font-weight="800" fill="#5361c8">INFRASTRUCTURE, DELIVERED WITH CONFIDENCE</text><text x="58" y="170" font-size="38" font-weight="900" fill="#101828">Infrastructure Storefront</text><text x="58" y="210" font-size="19" font-weight="700" fill="#253858">A faster, simpler way to request governed infrastructure.</text><text x="58" y="242" font-size="15" fill="#52637a">You choose the outcome. The platform owns the implementation.</text><rect x="58" y="296" width="210" height="44" rx="6" fill="url(#purple)"/><text x="163" y="324" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Browse Catalog →</text><text x="770" y="126" font-size="20" font-weight="800" fill="#171858">From request to governed review — the infrastructure drive-thru.</text></g>
