          - Security-Event Integration: bootstrap-foundation-readiness/foundation-domains/security-event-integration.md
          - Encryption and Key Management: bootstrap-foundation-readiness/foundation-domains/encryption-and-key-management.md
          - Secrets Management: bootstrap-foundation-readiness/foundation-domains/secrets-management.md
          - Delivery and Change Governance: bootstrap-foundation-readiness/foundation-domains/delivery-and-change-governance.md
          - Infrastructure-Product Contracts: bootstrap-foundation-readiness/foundation-domains/infrastructure-product-contracts.md
