          - Bootstrap Runtime: bootstrap-foundation-readiness/prerequisites/bootstrap-runtime-prerequisites.md
          - Read-Only Discovery: bootstrap-foundation-readiness/prerequisites/discovery-prerequisites.md
          - Provisioning: bootstrap-foundation-readiness/prerequisites/provisioning-prerequisites.md
          - Production Pilot: bootstrap-foundation-readiness/prerequisites/production-pilot-prerequisites.md
      - Foundation Domains:
          - Governance and Ownership: bootstrap-foundation-readiness/foundation-domains/governance-and-ownership.md
          - Resource Hierarchy: bootstrap-foundation-readiness/foundation-domains/resource-hierarchy.md
          - Identity and Access: bootstrap-foundation-readiness/foundation-domains/identity-and-access.md
          - Workload Identity: bootstrap-foundation-readiness/foundation-domains/workload-identity.md
          - Networking and Connectivity: bootstrap-foundation-readiness/foundation-domains/networking-and-connectivity.md
