site_name: AI-Powered Infrastructure as a Product
site_url: https://infrastructureproductworks.github.io/ai-powered-infrastructure-as-a-product/
repo_url: https://github.com/InfrastructureProductWorks/ai-powered-infrastructure-as-a-product
repo_name: InfrastructureProductWorks/ai-powered-infrastructure-as-a-product
site_description: IaaS is what we buy; infrastructure-as-a-product is what we build.
site_dir: generated-site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

nav:
  - Home: index.md
  - Executive Overview:
      - Decision Brief: executive/EXECUTIVE-DECISION-BRIEF.md
      - Executive Decision Deck: executive/EXECUTIVE-DECK.md
      - Suite Overview: executive/SUITE-OVERVIEW.md
      - Business Value and Outcomes: executive/BUSINESS-VALUE.md
      - Adoption Model: executive/ADOPTION-MODEL.md
      - Executive FAQ: executive/EXECUTIVE-FAQ.md
  - Thesis: THESIS.md
  - Product and Runtime Architecture: PRODUCT-ARCHITECTURE.md
  - Product Control Plane: architecture/product-control-plane.md
  - Bootstrap and Foundation Readiness:
      - Overview: bootstrap-foundation-readiness/README.md
      - Architecture:
          - Bootstrap Reference Architecture: bootstrap-foundation-readiness/architecture/bootstrap-reference-architecture.md
          - Authority and Trust Boundaries: bootstrap-foundation-readiness/architecture/authority-and-trust-boundaries.md
          - Customer-Hosted Deployment: bootstrap-foundation-readiness/architecture/customer-hosted-deployment.md
          - Progression and Decisions: bootstrap-foundation-readiness/architecture/progression-and-decision-model.md
      - Prerequisites:
